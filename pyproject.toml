[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geneline"
version = "0.1.0"
description = "Genetic-algorithm automatic tuner for LLM pipeline genomes (JSON-first prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
]

[project.scripts]
geneline = "geneline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
